<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <defs>
    <radialGradient id="im-bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </radialGradient>
    <radialGradient id="im-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="80" fill="url(#im-bg)"/>
  <rect width="100" height="80" fill="url(#im-glow)"/>

  <!-- 이무기(蛟): 승천 대기 — 물속의 거대 뱀 용 -->
  <!-- 물결 배경 -->
  <path d="M0,55 Q15,48 30,55 Q45,62 60,55 Q75,48 100,55 L100,80 L0,80Z" fill="#1e40af" opacity="0.25"/>
  <path d="M0,62 Q20,56 40,62 Q60,68 80,62 Q90,58 100,62 L100,80 L0,80Z" fill="#1d4ed8" opacity="0.2"/>
  <path d="M0,70 Q25,64 50,70 Q75,76 100,70 L100,80 L0,80Z" fill="#1e3a5f" opacity="0.4"/>

  <!-- 이무기 몸 (구불구불 파동) -->
  <path d="M10,70 C14,60 22,54 30,58 C38,62 40,54 46,48 C52,42 58,46 64,42 C70,38 74,28 80,22"
        stroke="#3b82f6" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M10,70 C14,60 22,54 30,58 C38,62 40,54 46,48 C52,42 58,46 64,42 C70,38 74,28 80,22"
        stroke="#60a5fa" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M10,70 C14,60 22,54 30,58 C38,62 40,54 46,48 C52,42 58,46 64,42 C70,38 74,28 80,22"
        stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- 비늘 -->
  <ellipse cx="24" cy="60" rx="4" ry="2" fill="#1d4ed8" transform="rotate(30 24 60)" opacity="0.8"/>
  <ellipse cx="36" cy="54" rx="4" ry="2" fill="#1d4ed8" transform="rotate(10 36 54)" opacity="0.8"/>
  <ellipse cx="48" cy="48" rx="4" ry="2" fill="#1d4ed8" transform="rotate(-15 48 48)" opacity="0.8"/>
  <ellipse cx="60" cy="42" rx="4" ry="2" fill="#1d4ed8" transform="rotate(-30 60 42)" opacity="0.8"/>
  <ellipse cx="70" cy="34" rx="4" ry="2" fill="#1d4ed8" transform="rotate(-45 70 34)" opacity="0.8"/>

  <!-- 머리 -->
  <ellipse cx="82" cy="20" rx="11" ry="7" fill="#3b82f6" transform="rotate(-45 82 20)"/>
  <ellipse cx="82" cy="20" rx="8" ry="5" fill="#60a5fa" transform="rotate(-45 82 20)"/>
  <!-- 뿔 (곧 승천할 뿔이 자라는 중) -->
  <path d="M78,13 L74,7 L79,12" fill="#93c5fd" opacity="0.8"/>
  <path d="M84,11 L82,5 L86,10" fill="#93c5fd" opacity="0.6"/>
  <!-- 눈 (붉은빛 — 용이 되고자 하는 염원) -->
  <circle cx="87" cy="16" r="3" fill="#fef9c3"/>
  <circle cx="87" cy="16" r="2" fill="#dc2626"/>
  <circle cx="87" cy="16" r="1" fill="#000"/>
  <circle cx="87.4" cy="15.6" r="0.4" fill="#fff"/>
  <!-- 수염 -->
  <path d="M82,22 C78,26 72,26 68,24" stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M82,24 C80,30 76,32 72,30" stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- 혀 -->
  <path d="M76,22 L70,20 M76,22 L70,24" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>

  <!-- 꼬리 (물 속으로) -->
  <path d="M10,70 C6,74 8,78 12,78 L10,74 L14,76 L12,72" fill="#3b82f6" opacity="0.7"/>

  <!-- 물방울/거품 -->
  <circle cx="18" cy="52" r="1.5" fill="#93c5fd" opacity="0.5"/>
  <circle cx="42" cy="44" r="1.2" fill="#93c5fd" opacity="0.4"/>
  <circle cx="58" cy="38" r="1" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="25" cy="68" r="2" fill="#60a5fa" opacity="0.3"/>
  <circle cx="55" cy="64" r="1.5" fill="#60a5fa" opacity="0.3"/>
</svg>
