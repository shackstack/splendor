<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <defs>
    <radialGradient id="cn-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="cn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="80" fill="url(#cn-bg)"/>
  <rect width="100" height="80" fill="url(#cn-glow)"/>

  <!-- 청룡(靑龍): 구불구불 승천하는 용 -->
  <!-- 여의주 -->
  <circle cx="78" cy="14" r="8" fill="#4ade80" opacity="0.3"/>
  <circle cx="78" cy="14" r="6" fill="#86efac" opacity="0.5"/>
  <circle cx="78" cy="14" r="4" fill="#bbf7d0"/>
  <circle cx="76" cy="12" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- 용 몸통 (S자 곡선) -->
  <path d="M20,72 C18,62 22,54 30,50 C38,46 46,48 50,42 C54,36 52,28 58,22 C64,16 72,14 78,20"
        stroke="#4ade80" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M20,72 C18,62 22,54 30,50 C38,46 46,48 50,42 C54,36 52,28 58,22 C64,16 72,14 78,20"
        stroke="#86efac" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M20,72 C18,62 22,54 30,50 C38,46 46,48 50,42 C54,36 52,28 58,22 C64,16 72,14 78,20"
        stroke="#dcfce7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- 비늘 장식 -->
  <ellipse cx="30" cy="50" rx="4" ry="2.5" fill="#16a34a" transform="rotate(-20 30 50)" opacity="0.8"/>
  <ellipse cx="40" cy="46" rx="4" ry="2.5" fill="#16a34a" transform="rotate(-10 40 46)" opacity="0.8"/>
  <ellipse cx="50" cy="42" rx="4" ry="2.5" fill="#16a34a" transform="rotate(5 50 42)" opacity="0.8"/>
  <ellipse cx="58" cy="34" rx="4" ry="2.5" fill="#16a34a" transform="rotate(20 58 34)" opacity="0.8"/>
  <ellipse cx="66" cy="26" rx="4" ry="2.5" fill="#16a34a" transform="rotate(35 66 26)" opacity="0.8"/>

  <!-- 머리 -->
  <ellipse cx="80" cy="22" rx="9" ry="6" fill="#22c55e" transform="rotate(-30 80 22)"/>
  <ellipse cx="80" cy="22" rx="6" ry="4" fill="#4ade80" transform="rotate(-30 80 22)"/>
  <!-- 뿔 -->
  <path d="M76,16 L73,10 L77,14" fill="#86efac"/>
  <path d="M82,14 L82,8 L85,13" fill="#86efac"/>
  <!-- 눈 -->
  <circle cx="84" cy="20" r="2" fill="#fbbf24"/>
  <circle cx="84" cy="20" r="1" fill="#000"/>
  <circle cx="84.5" cy="19.5" r="0.4" fill="#fff"/>

  <!-- 앞발 -->
  <path d="M34,56 C30,58 26,56 24,60 L28,58 L26,62 L30,60 L28,64 L32,61 L30,65 L34,62"
        fill="#22c55e" opacity="0.8"/>

  <!-- 구름 -->
  <ellipse cx="15" cy="30" rx="8" ry="4" fill="#166534" opacity="0.4"/>
  <ellipse cx="20" cy="27" rx="6" ry="4" fill="#166534" opacity="0.4"/>
  <ellipse cx="12" cy="27" rx="5" ry="3" fill="#166534" opacity="0.3"/>
  <ellipse cx="55" cy="65" rx="8" ry="4" fill="#166534" opacity="0.3"/>
  <ellipse cx="62" cy="62" rx="6" ry="3" fill="#166534" opacity="0.3"/>
</svg>
