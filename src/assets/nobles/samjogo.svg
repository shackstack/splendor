<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <defs>
    <radialGradient id="sj-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="sj-sun" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="80" fill="url(#sj-bg)"/>
  <rect width="100" height="80" fill="url(#sj-sun)"/>

  <!-- 삼족오(三足烏): 태양 신조 — 태양 속의 세발 까마귀 -->
  <!-- 태양 원형 -->
  <circle cx="50" cy="36" r="28" fill="#fbbf24" opacity="0.15"/>
  <circle cx="50" cy="36" r="22" fill="#fde047" opacity="0.2"/>
  <!-- 태양 광선 -->
  <g opacity="0.5">
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(30 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(60 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(90 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(120 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(150 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(180 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(210 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(240 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(270 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(300 50 36)"/>
    <line x1="50" y1="6" x2="50" y2="1" stroke="#fde047" stroke-width="2" stroke-linecap="round" transform="rotate(330 50 36)"/>
  </g>
  <!-- 태양 테두리 -->
  <circle cx="50" cy="36" r="22" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="36" r="18" fill="none" stroke="#fde047" stroke-width="0.8" opacity="0.4"/>

  <!-- 까마귀 몸통 (태양 안) -->
  <ellipse cx="50" cy="36" rx="10" ry="8" fill="#1c1917"/>
  <ellipse cx="50" cy="36" rx="8" ry="6.5" fill="#292524"/>

  <!-- 날개 -->
  <path d="M42,34 C36,28 26,26 20,30 C26,32 34,34 40,36" fill="#1c1917"/>
  <path d="M58,34 C64,28 74,26 80,30 C74,32 66,34 60,36" fill="#1c1917"/>
  <!-- 날개 깃털 라인 -->
  <path d="M42,34 C36,30 28,28 22,30" stroke="#44403c" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M42,36 C36,34 28,32 20,34" stroke="#44403c" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M58,34 C64,30 72,28 78,30" stroke="#44403c" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M58,36 C64,34 72,32 80,34" stroke="#44403c" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- 머리 -->
  <circle cx="50" cy="28" r="7" fill="#1c1917"/>
  <!-- 부리 -->
  <path d="M56,27 L64,25 L58,29 Z" fill="#fbbf24"/>
  <!-- 눈 (황금) -->
  <circle cx="53" cy="26" r="3" fill="#fde047"/>
  <circle cx="53" cy="26" r="2" fill="#000"/>
  <circle cx="53.6" cy="25.4" r="0.7" fill="#fff"/>
  <!-- 볏 -->
  <path d="M46,22 L44,16 L48,20 L46,14 L50,19 L48,13 L52,18" fill="#fbbf24" opacity="0.8"/>

  <!-- 세 발 (삼족) -->
  <path d="M44,42 L40,52 L38,56 M40,52 L36,56 M40,52 L42,56" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50,44 L50,56 M50,56 L46,60 M50,56 L50,62 M50,56 L54,60" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56,42 L60,52 L64,56 M60,52 L60,58 M60,52 L58,56" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 발톱 -->
  <circle cx="38" cy="56" r="1.5" fill="#fbbf24"/>
  <circle cx="42" cy="56" r="1.5" fill="#fbbf24"/>
  <circle cx="36" cy="56" r="1.5" fill="#fbbf24"/>
  <circle cx="46" cy="60" r="1.5" fill="#fbbf24"/>
  <circle cx="50" cy="62" r="1.5" fill="#fbbf24"/>
  <circle cx="54" cy="60" r="1.5" fill="#fbbf24"/>
  <circle cx="58" cy="56" r="1.5" fill="#fbbf24"/>
  <circle cx="64" cy="56" r="1.5" fill="#fbbf24"/>
  <circle cx="60" cy="58" r="1.5" fill="#fbbf24"/>
</svg>
