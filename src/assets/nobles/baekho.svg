<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <defs>
    <radialGradient id="bh-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="bh-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="80" fill="url(#bh-bg)"/>
  <rect width="100" height="80" fill="url(#bh-glow)"/>

  <!-- 백호(白虎): 호랑이 정면 얼굴 -->
  <!-- 귀 -->
  <polygon points="30,20 22,8 38,16" fill="#cbd5e1"/>
  <polygon points="70,20 78,8 62,16" fill="#cbd5e1"/>
  <polygon points="30,20 24,10 36,17" fill="#f43f5e" opacity="0.6"/>
  <polygon points="70,20 76,10 64,17" fill="#f43f5e" opacity="0.6"/>

  <!-- 얼굴 -->
  <ellipse cx="50" cy="44" rx="28" ry="26" fill="#e2e8f0"/>
  <ellipse cx="50" cy="44" rx="24" ry="22" fill="#f1f5f9"/>

  <!-- 줄무늬 (이마) -->
  <path d="M50,20 C50,24 50,28 50,32" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M44,22 C43,26 43,30 44,33" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M56,22 C57,26 57,30 56,33" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M38,26 C37,29 37,32 39,34" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M62,26 C63,29 63,32 61,34" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- 눈 -->
  <ellipse cx="38" cy="38" rx="8" ry="6" fill="#fbbf24"/>
  <ellipse cx="62" cy="38" rx="8" ry="6" fill="#fbbf24"/>
  <ellipse cx="38" cy="38" rx="5" ry="5" fill="#78350f"/>
  <ellipse cx="62" cy="38" rx="5" ry="5" fill="#78350f"/>
  <ellipse cx="38" cy="38" rx="3" ry="4.5" fill="#1c1917"/>
  <ellipse cx="62" cy="38" rx="3" ry="4.5" fill="#1c1917"/>
  <circle cx="36.5" cy="36.5" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="60.5" cy="36.5" r="1.2" fill="#fff" opacity="0.8"/>

  <!-- 코 -->
  <ellipse cx="50" cy="48" rx="6" ry="4" fill="#f9a8d4"/>
  <ellipse cx="50" cy="48" rx="4" ry="2.8" fill="#fce7f3"/>
  <circle cx="48" cy="47" r="1.2" fill="#4c1d95" opacity="0.8"/>
  <circle cx="52" cy="47" r="1.2" fill="#4c1d95" opacity="0.8"/>

  <!-- 수염 -->
  <line x1="44" y1="50" x2="18" y2="47" stroke="#94a3b8" stroke-width="0.8" opacity="0.7"/>
  <line x1="44" y1="52" x2="18" y2="53" stroke="#94a3b8" stroke-width="0.8" opacity="0.7"/>
  <line x1="44" y1="54" x2="20" y2="58" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
  <line x1="56" y1="50" x2="82" y2="47" stroke="#94a3b8" stroke-width="0.8" opacity="0.7"/>
  <line x1="56" y1="52" x2="82" y2="53" stroke="#94a3b8" stroke-width="0.8" opacity="0.7"/>
  <line x1="56" y1="54" x2="80" y2="58" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>

  <!-- 입 -->
  <path d="M45,55 Q50,60 55,55" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 볼 줄무늬 -->
  <path d="M24,38 C22,40 20,42 22,45" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M76,38 C78,40 80,42 78,45" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
