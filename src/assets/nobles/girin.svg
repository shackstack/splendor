  <path d="M42,52 C40,44 42,36 46,30" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M42,52 C40,44 42,36 46,30" stroke="#ede9fe" stroke-width="4" stroke-linecap="round" fill="none"/>

