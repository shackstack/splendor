<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="hwangok-base" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <linearGradient id="hwangok-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="hwangok-shine" cx="32%" cy="27%" r="36%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hwangok-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#92400e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 황옥: 쿠션 컷 (사각형 + 둥근 모서리 느낌의 팔각형) -->
  <polygon
    points="20,6 44,6 58,20 58,44 44,58 20,58 6,44 6,20"
    fill="url(#hwangok-base)"
    filter="url(#hwangok-shadow)"
  />
  <!-- 테이블(상단 중앙 평면) -->
  <polygon
    points="22,16 42,16 50,24 50,40 42,48 22,48 14,40 14,24"
    fill="#fde047"
    opacity="0.3"
  />
  <!-- 코너 패싯들 -->
  <polygon points="20,6 22,16 14,24 6,20" fill="#fef08a" opacity="0.3"/>
  <polygon points="44,6 42,16 50,24 58,20" fill="#fbbf24" opacity="0.4"/>
  <polygon points="44,58 42,48 50,40 58,44" fill="#b45309" opacity="0.5"/>
  <polygon points="20,58 22,48 14,40 6,44" fill="#d97706" opacity="0.3"/>
  <!-- 상하 패싯 -->
  <polygon points="20,6 44,6 42,16 22,16" fill="#fef9c3" opacity="0.4"/>
  <polygon points="20,58 44,58 42,48 22,48" fill="#92400e" opacity="0.5"/>
  <!-- 좌우 패싯 -->
  <polygon points="6,20 14,24 14,40 6,44" fill="#fde047" opacity="0.3"/>
  <polygon points="58,20 50,24 50,40 58,44" fill="#d97706" opacity="0.5"/>
  <!-- 별 패싯 (중앙에서 뻗어나가는 라인) -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
  <line x1="22" y1="16" x2="42" y2="48" stroke="#fbbf24" stroke-width="0.6" opacity="0.3"/>
  <line x1="42" y1="16" x2="22" y2="48" stroke="#fbbf24" stroke-width="0.6" opacity="0.3"/>
  <!-- 광택 -->
  <ellipse cx="26" cy="22" rx="8" ry="5" fill="url(#hwangok-shine)" transform="rotate(-25 26 22)"/>
  <circle cx="23" cy="19" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
