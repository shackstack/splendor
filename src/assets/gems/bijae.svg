<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bj-core" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="bj-shine" cx="32%" cy="27%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bj-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14532d" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 木(목) 정령석: 잎사귀 형태 (위아래 뾰족한 마름모+곡선) -->
  <path d="M32,5 C40,14 52,20 52,32 C52,44 40,50 32,59 C24,50 12,44 12,32 C12,20 24,14 32,5 Z"
        fill="url(#bj-core)" filter="url(#bj-shadow)"/>
  <!-- 잎맥 -->
  <line x1="32" y1="5" x2="32" y2="59" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="20" x2="20" y2="35" stroke="#4ade80" stroke-width="0.7" opacity="0.3"/>
  <line x1="32" y1="20" x2="44" y2="35" stroke="#4ade80" stroke-width="0.7" opacity="0.3"/>
  <line x1="32" y1="32" x2="17" y2="42" stroke="#4ade80" stroke-width="0.7" opacity="0.3"/>
  <line x1="32" y1="32" x2="47" y2="42" stroke="#4ade80" stroke-width="0.7" opacity="0.3"/>
  <!-- 내부 윤곽 -->
  <path d="M32,12 C38,19 46,24 46,32 C46,40 38,45 32,52 C26,45 18,40 18,32 C18,24 26,19 32,12 Z"
        fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.5"/>
  <!-- 木 한자 -->
  <text x="32" y="38" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#4ade80" opacity="0.3" font-family="serif">木</text>
  <!-- 광택 -->
  <ellipse cx="25" cy="20" rx="7" ry="4" fill="url(#bj-shine)" transform="rotate(-25 25 20)"/>
  <circle cx="22" cy="18" r="2.5" fill="#ffffff" opacity="0.75"/>
</svg>
