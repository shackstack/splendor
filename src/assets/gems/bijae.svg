<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bijae-base" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="bijae-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="bijae-shine" cx="35%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bijae-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#166534" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 비취: 육각형 (동양 옥 느낌) -->
  <polygon
    points="32,6 54,19 54,45 32,58 10,45 10,19"
    fill="url(#bijae-base)"
    filter="url(#bijae-shadow)"
  />
  <!-- 육각형 내부 패싯 -->
  <polygon
    points="32,14 48,23 48,41 32,50 16,41 16,23"
    fill="url(#bijae-inner)"
    stroke="#4ade80"
    stroke-width="0.8"
    opacity="0.8"
  />
  <!-- 패싯 라인들 -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#86efac" stroke-width="0.7" opacity="0.4"/>
  <line x1="16" y1="23" x2="48" y2="41" stroke="#86efac" stroke-width="0.7" opacity="0.4"/>
  <line x1="48" y1="23" x2="16" y2="41" stroke="#86efac" stroke-width="0.7" opacity="0.4"/>
  <!-- 중앙 허리선 -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#4ade80" stroke-width="0.6" opacity="0.3"/>
  <!-- 상단 삼각형 패싯들 -->
  <polygon points="32,6 54,19 48,23 32,14 16,23 10,19" fill="#86efac" opacity="0.2"/>
  <!-- 하단 -->
  <polygon points="32,58 54,45 48,41 32,50 16,41 10,45" fill="#15803d" opacity="0.3"/>
  <!-- 광택 -->
  <ellipse cx="26" cy="22" rx="8" ry="5" fill="url(#bijae-shine)" transform="rotate(-25 26 22)"/>
  <circle cx="23" cy="20" r="2.5" fill="#ffffff" opacity="0.7"/>
</svg>
