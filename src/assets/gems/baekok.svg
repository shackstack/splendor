<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bk-core" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="bk-shine" cx="32%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bk-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 金(금) 정령석: 팔각 메달 형태 -->
  <polygon points="32,5 46,9 57,20 59,34 54,48 42,57 32,59 22,57 10,48 5,34 7,20 18,9"
           fill="url(#bk-core)" filter="url(#bk-shadow)"/>
  <!-- 외곽 링 -->
  <polygon points="32,5 46,9 57,20 59,34 54,48 42,57 32,59 22,57 10,48 5,34 7,20 18,9"
           fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6"/>
  <!-- 내부 팔각형 -->
  <polygon points="32,13 43,17 51,25 51,39 43,47 32,51 21,47 13,39 13,25 21,17"
           fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>
  <!-- 金 한자 -->
  <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="bold"
        fill="#475569" opacity="0.35" font-family="serif">金</text>
  <!-- 광택 -->
  <ellipse cx="25" cy="21" rx="8" ry="5" fill="url(#bk-shine)" transform="rotate(-30 25 21)"/>
  <circle cx="22" cy="19" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
