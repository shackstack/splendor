<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="hk-core" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="hk-shine" cx="32%" cy="26%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hk-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#7f1d1d" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- 火(화) 정령석: 불꽃 형태 (위가 뾰족한 역삼각형+곡선) -->
  <path d="M32,5 L52,22 C56,32 52,46 42,54 C38,57 35,59 32,59 C29,59 26,57 22,54 C12,46 8,32 12,22 Z"
        fill="url(#hk-core)" filter="url(#hk-shadow)"/>
  <!-- 불꽃 내부 -->
  <path d="M32,13 L46,26 C50,34 47,44 40,50 C37,53 34,54 32,54 C30,54 27,53 24,50 C17,44 14,34 18,26 Z"
        fill="none" stroke="#f87171" stroke-width="0.9" opacity="0.5"/>
  <!-- 화염 패싯 -->
  <line x1="32" y1="5" x2="32" y2="59" stroke="#ef4444" stroke-width="0.8" opacity="0.3"/>
  <line x1="12" y1="22" x2="42" y2="54" stroke="#f87171" stroke-width="0.6" opacity="0.25"/>
  <line x1="52" y1="22" x2="22" y2="54" stroke="#f87171" stroke-width="0.6" opacity="0.25"/>
  <line x1="20" y1="40" x2="44" y2="40" stroke="#fca5a5" stroke-width="0.6" opacity="0.3"/>
  <!-- 火 한자 -->
  <text x="32" y="40" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#fca5a5" opacity="0.3" font-family="serif">火</text>
  <!-- 광택 -->
  <ellipse cx="25" cy="19" rx="7" ry="4" fill="url(#hk-shine)" transform="rotate(-20 25 19)"/>
  <circle cx="22" cy="17" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
