<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="gk-core" cx="40%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <radialGradient id="gk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gk-shine" cx="33%" cy="27%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gk-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2e1065" flood-opacity="0.6"/>
    </filter>
    <filter id="gk-glow-f">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 氣(기) 정령석: 별/소용돌이 형태 — 와일드 기운 -->
  <!-- 외부 글로우 -->
  <polygon
    points="32,3 36,20 52,15 42,29 60,32 42,35 52,49 36,44 32,61 28,44 12,49 22,35 4,32 22,29 12,15 28,20"
    fill="#7c3aed" opacity="0.2" filter="url(#gk-glow-f)"/>
  <!-- 별 본체 -->
  <polygon
    points="32,6 35.5,21 51,16 41.5,28.5 58,32 41.5,35.5 51,48 35.5,43 32,58 28.5,43 13,48 22.5,35.5 6,32 22.5,28.5 13,16 28.5,21"
    fill="url(#gk-core)" filter="url(#gk-shadow)"/>
  <!-- 중앙 원 -->
  <circle cx="32" cy="32" r="11" fill="url(#gk-glow)"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.6"/>
  <!-- 소용돌이 패턴 -->
  <path d="M32,24 C36,24 40,28 40,32 C40,36 36,40 32,40 C28,40 24,36 24,32 C24,28 28,26 32,26"
        fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
  <!-- 별 포인트 하이라이트 -->
  <polygon points="32,6 28.5,21 35.5,21" fill="#ede9fe" opacity="0.4"/>
  <polygon points="6,32 22.5,28.5 22.5,35.5" fill="#ede9fe" opacity="0.3"/>
  <!-- 별 포인트 어두운 면 -->
  <polygon points="58,32 41.5,28.5 41.5,35.5" fill="#2e1065" opacity="0.4"/>
  <polygon points="32,58 28.5,43 35.5,43" fill="#2e1065" opacity="0.4"/>
  <!-- 氣 한자 -->
  <text x="32" y="36" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#c4b5fd" opacity="0.5" font-family="serif">氣</text>
  <!-- 광택 -->
  <ellipse cx="26" cy="23" rx="6" ry="4" fill="url(#gk-shine)" transform="rotate(-20 26 23)"/>
  <circle cx="24" cy="21" r="2" fill="#ffffff" opacity="0.9"/>
  <!-- 별 끝 반짝임 -->
  <circle cx="32" cy="7" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="7" cy="32" r="1" fill="#fff" opacity="0.5"/>
</svg>
