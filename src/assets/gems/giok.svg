<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="giok-base" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="giok-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="giok-shine" cx="33%" cy="27%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="giok-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4c1d95" flood-opacity="0.6"/>
    </filter>
    <filter id="giok-glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 기옥(와일드): 별 모양 (특별한 황금빛 느낌) -->
  <!-- 외부 글로우 -->
  <polygon
    points="32,3 37,21 54,14 43,29 61,32 43,35 54,50 37,43 32,61 27,43 10,50 21,35 3,32 21,29 10,14 27,21"
    fill="#7c3aed"
    opacity="0.25"
    filter="url(#giok-glow-filter)"
  />
  <!-- 별 모양 본체 -->
  <polygon
    points="32,6 36,22 52,16 42,30 58,32 42,34 52,48 36,42 32,58 28,42 12,48 22,34 6,32 22,30 12,16 28,22"
    fill="url(#giok-base)"
    filter="url(#giok-shadow)"
  />
  <!-- 중앙 원 -->
  <circle cx="32" cy="32" r="11" fill="url(#giok-glow)" stroke="#c4b5fd" stroke-width="0.8" opacity="0.7"/>
  <!-- 별 포인트 하이라이트 (밝은 면) -->
  <polygon points="32,6 28,22 36,22" fill="#ddd6fe" opacity="0.5"/>
  <polygon points="6,32 22,28 22,36" fill="#ddd6fe" opacity="0.4"/>
  <polygon points="12,16 22,28 28,22" fill="#a78bfa" opacity="0.4"/>
  <!-- 별 포인트 어두운 면 -->
  <polygon points="58,32 42,28 42,36" fill="#4c1d95" opacity="0.4"/>
  <polygon points="52,16 42,28 36,22" fill="#6d28d9" opacity="0.4"/>
  <polygon points="32,58 28,42 36,42" fill="#4c1d95" opacity="0.5"/>
  <polygon points="52,48 42,36 36,42" fill="#6d28d9" opacity="0.4"/>
  <polygon points="12,48 22,36 28,42" fill="#7c3aed" opacity="0.3"/>
  <!-- 중앙 십자 패싯 -->
  <line x1="32" y1="21" x2="32" y2="43" stroke="#c4b5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="21" y1="32" x2="43" y2="32" stroke="#c4b5fd" stroke-width="0.8" opacity="0.5"/>
  <!-- 광택 -->
  <ellipse cx="27" cy="24" rx="6" ry="4" fill="url(#giok-shine)" transform="rotate(-20 27 24)"/>
  <circle cx="24" cy="22" r="2" fill="#ffffff" opacity="0.9"/>
  <!-- 별 포인트 작은 반짝임 -->
  <circle cx="32" cy="8" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="8" cy="32" r="1" fill="#ffffff" opacity="0.5"/>
</svg>
